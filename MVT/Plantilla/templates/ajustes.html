{% extends "base.html" %}

{% block titulo %}Ajustes | Dizar Asociados{% endblock %}

{% block clase_main %}ajustes{% endblock %}

{% block contenido %}
    <div class="contenedor-login">
        <h1>Ajustes de la cuenta</h1>

        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        {% if exito %}<div class="exito">{{ exito }}</div>{% endif %}

        <form method="POST" action="/ajustes">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <input type="hidden" name="accion" value="perfil">
            <div class="campo">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" name="usuario" value="{{ datos.get('usuario', '') }}" required>
            </div>
            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" value="{{ datos.get('correo', '') }}" required>
            </div>
            <div class="campo">
                <label>Documento</label>
                <input type="text" value="{{ ((datos.get('tipo_documento') or '') ~ ' ' ~ (datos.get('numero_documento') or '')).strip() }}" disabled>
            </div>
            <button type="submit" class="btn">Guardar cambios</button>
        </form>

        <button type="button" class="btn-desplegar{{ ' abierto' if abrir_pass else '' }}" id="btnPassword"
                aria-expanded="{{ 'true' if abrir_pass else 'false' }}" aria-controls="panelPassword">
            <span>Cambiar contraseña</span>
            <span class="flecha"></span>
        </button>

        <div class="panel-desplegable{{ ' abierto' if abrir_pass else '' }}" id="panelPassword">
            <div class="panel-interior">
                <form method="POST" action="/ajustes">
                    <input type="hidden" name="csrf" value="{{ csrf }}">
                    <input type="hidden" name="accion" value="contrasena">
                    <div class="campo">
                        <label for="actual">Contraseña actual</label>
                        <input type="password" id="actual" name="actual" required>
                    </div>
                    <div class="campo">
                        <label for="nueva">Nueva contraseña</label>
                        <input type="password" id="nueva" name="nueva" minlength="6" required>
                    </div>
                    <div class="campo">
                        <label for="confirmar">Confirmar nueva contraseña</label>
                        <input type="password" id="confirmar" name="confirmar" minlength="6" required>
                    </div>
                    <button type="submit" class="btn">Actualizar contraseña</button>
                </form>
            </div>
        </div>
    </div>

    <script>
    document.getElementById("btnPassword").addEventListener("click", function () {
        const panel = document.getElementById("panelPassword");
        const abierto = panel.classList.toggle("abierto");
        this.classList.toggle("abierto", abierto);
        this.setAttribute("aria-expanded", abierto);
    });
    </script>
{% endblock %}
